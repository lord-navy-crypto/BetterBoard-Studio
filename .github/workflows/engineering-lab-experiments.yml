name: Engineering Lab Experiments

on:
  pull_request:
    paths:
      - 'engineering-lab-experiments/**'
      - 'firmware/betterboard-core/**'
      - 'scripts/engineering_lab_schema_self_check.py'
      - 'docs/ENGINEERING_LAB_EXPERIMENTS.md'
      - '.github/workflows/engineering-lab-experiments.yml'
  push:
    branches:
      - 'feature/engineering-lab-experiments-v1'
      - 'enhance/**'
    paths:
      - 'engineering-lab-experiments/**'
      - 'firmware/betterboard-core/**'
      - 'scripts/engineering_lab_schema_self_check.py'
      - 'docs/ENGINEERING_LAB_EXPERIMENTS.md'
      - '.github/workflows/engineering-lab-experiments.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate Engineering Lab v2 stream schemas
        run: python3 scripts/engineering_lab_schema_self_check.py

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino cores and sensor libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core install esp32:esp32
          python3 - <<'PY' > /tmp/bb-libraries.txt
          import json
          from pathlib import Path
          libraries = set()
          for path in sorted(Path('sensor-suite').glob('catalog*.json')):
              for entry in json.loads(path.read_text()):
                  libraries.update(entry.get('required_libraries', []))
          for library in sorted(libraries):
              print(library)
          PY
          while IFS= read -r library; do
            [ -z "$library" ] || arduino-cli lib install "$library"
          done < /tmp/bb-libraries.txt

      - name: Build Engineering Lab sketch list
        run: |
          python3 - <<'PY' > /tmp/el-sketches.txt
          import json
          from pathlib import Path
          for entry in json.loads(Path('engineering-lab-experiments/catalog.json').read_text()):
              print(entry['sketch_name'])
          PY
          test "$(wc -l < /tmp/el-sketches.txt | tr -d ' ')" = "9"

      - name: Compile Engineering Lab experiments for UNO
        run: |
          while IFS= read -r sketch; do
            arduino-cli compile --fqbn arduino:avr:uno --library firmware/betterboard-core "engineering-lab-experiments/firmware/$sketch"
          done < /tmp/el-sketches.txt

      - name: Compile Engineering Lab experiments for ESP32-S3
        run: |
          while IFS= read -r sketch; do
            arduino-cli compile --fqbn esp32:esp32:esp32s3 --library firmware/betterboard-core "engineering-lab-experiments/firmware/$sketch"
          done < /tmp/el-sketches.txt
