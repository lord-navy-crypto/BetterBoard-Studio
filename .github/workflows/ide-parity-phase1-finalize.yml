name: Finalize IDE Parity Phase 1

on:
  push:
    branches:
      - ux/ide-parity-phase1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ide-parity-phase1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install smart-editor dependencies and bump alpha
        run: |
          npm install @monaco-editor/react monaco-editor
          npm version 0.2.0-alpha.4 --no-git-tag-version

      - name: Wire IDE backend, version and regression contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          lib_path = root / 'src-tauri/src/lib.rs'
          lib = lib_path.read_text()
          old_mod = 'mod openguin_bridge;\nmod serial_stream;'
          assert old_mod in lib
          lib = lib.replace(old_mod, 'mod openguin_bridge;\nmod serial_stream;\nmod ide_manager;', 1)
          anchor = '''            measurement_session_load,\n            openguin_bridge::openguin_probe,'''
          replacement = '''            measurement_session_load,\n            ide_manager::arduino_core_list,\n            ide_manager::arduino_core_search,\n            ide_manager::arduino_core_update_index,\n            ide_manager::arduino_core_install,\n            ide_manager::arduino_core_uninstall,\n            ide_manager::arduino_board_url_add,\n            ide_manager::arduino_library_list,\n            ide_manager::arduino_library_search,\n            ide_manager::arduino_library_update_index,\n            ide_manager::arduino_library_install,\n            ide_manager::arduino_library_uninstall,\n            ide_manager::arduino_library_examples,\n            ide_manager::developer_sketchbook_list,\n            ide_manager::developer_project_files,\n            ide_manager::developer_project_file_save,\n            openguin_bridge::openguin_probe,'''
          assert anchor in lib
          lib = lib.replace(anchor, replacement, 1)
          lib = lib.replace('const APP_VERSION: &str = "0.2.0-alpha.3";', 'const APP_VERSION: &str = "0.2.0-alpha.4";', 1)
          lib_path.write_text(lib)

          cargo = root / 'src-tauri/Cargo.toml'
          text = cargo.read_text()
          text = text.replace('version = "0.2.0-alpha.3"', 'version = "0.2.0-alpha.4"', 1)
          cargo.write_text(text)

          lock = root / 'src-tauri/Cargo.lock'
          text = lock.read_text()
          text = text.replace('name = "betterboard-studio"\nversion = "0.2.0-alpha.3"', 'name = "betterboard-studio"\nversion = "0.2.0-alpha.4"', 1)
          lock.write_text(text)

          tauri = root / 'src-tauri/tauri.conf.json'
          data = json.loads(tauri.read_text())
          data['version'] = '0.2.0-alpha.4'
          tauri.write_text(json.dumps(data, indent=2) + '\n')

          app = root / 'src/App.tsx'
          text = app.read_text().replace('Studio · Alpha 0.2', 'Studio · Alpha 0.4')
          app.write_text(text)

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text()
          section = '''## 0.2.0-alpha.4\n\n- Began **IDE Parity Phase 1** so BetterBoard can replace the Arduino IDE for normal local development rather than requiring users to leave the app.\n- Replaced the plain Developer textarea with a Monaco-based Arduino/C++ smart editor: syntax highlighting, line numbers, folding, bracket-pair colorization, find/replace, Arduino starter autocomplete, and compile-error/warning markers.\n- Added Developer sub-workspaces for **Editor**, **Boards & Libraries**, and **Sketchbook**.\n- Added Arduino CLI-backed Board Manager operations: installed/search, index update, install/uninstall, and additional package-index URL configuration.\n- Added Arduino CLI-backed Library Manager operations: installed/search, index update, install/uninstall, and library examples.\n- Added local Sketchbook discovery across `~/Documents/Arduino` and `~/Documents/BetterBoard/sketches`.\n- Added bounded multi-file project editing for `.ino`, `.cpp`, `.c`, `.h`, and `.hpp`; project files save back to the selected sketch directory and Verify/Upload compiles the whole project.\n- Kept Recipe templates, My Library, OpenPenguin, Runtime Facts, Task Center, Monitor/Data, Evidence, Numerical and Magnet workflows intact.\n\n'''
          assert '# Changelog\n\n' in text
          changelog.write_text(text.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1))

          doc = root / 'docs/IDE_PARITY_PHASE1.md'
          doc.write_text('''# IDE Parity Phase 1\n\nBetterBoard treats Arduino IDE 2 capabilities as a baseline, not a differentiator.\n\n## Implemented in alpha.4\n\n- Monaco-based C++/Arduino editor\n- Arduino starter autocomplete and compile-diagnostic markers\n- Board Manager via Arduino CLI\n- Library Manager via Arduino CLI\n- Library examples via Arduino CLI\n- Arduino + BetterBoard sketchbook discovery\n- bounded multi-file project editing and whole-project Verify/Upload\n\n## Architecture\n\nBetterBoard does not duplicate the Arduino package ecosystem. Board and library operations delegate to the locally installed `arduino-cli`, while BetterBoard adds orchestration, tasks, recipes, measurement evidence, experiments, Observatory, Learning, and local AI.\n\n## Remaining parity work\n\n- richer language-server completion / go-to-definition\n- configurable formatter\n- ZIP library picker UX\n- board-specific menu options / programmers\n- full debugger UI and `arduino-cli debug` integration\n- deeper Serial Plotter controls\n- create/rename/delete project files in the project tree\n''')

          self_path = root / 'scripts/self_check.py'
          s = self_path.read_text()
          s = s.replace("OPENGUIN_BRIDGE = ROOT / 'src' / 'OpenPenguinBridge.tsx'\nMAIN =", "OPENGUIN_BRIDGE = ROOT / 'src' / 'OpenPenguinBridge.tsx'\nSMART_EDITOR = ROOT / 'src' / 'SmartArduinoEditor.tsx'\nECOSYSTEM_MANAGER = ROOT / 'src' / 'ArduinoEcosystemManager.tsx'\nSKETCHBOOK_EXPLORER = ROOT / 'src' / 'SketchbookExplorer.tsx'\nIDE_MANAGER_RUST = ROOT / 'src-tauri' / 'src' / 'ide_manager.rs'\nMAIN =")
          s = s.replace('HARDWARE_SESSION, OBSERVATORY, LEARNING, RECIPE_PARAMETERS, RUNTIME_LOG, OPENGUIN_BRIDGE, MAIN,', 'HARDWARE_SESSION, OBSERVATORY, LEARNING, RECIPE_PARAMETERS, RUNTIME_LOG, OPENGUIN_BRIDGE, SMART_EDITOR, ECOSYSTEM_MANAGER, SKETCHBOOK_EXPLORER, IDE_MANAGER_RUST, MAIN,')
          needle = "    assert 'Expert workflows' in hub and 'Advanced Tools' not in hub\n\n"
          extra = '''    # Arduino IDE parity Phase 1 must stay reachable and real.\n    smart = SMART_EDITOR.read_text()\n    ecosystem = ECOSYSTEM_MANAGER.read_text()\n    sketchbook = SKETCHBOOK_EXPLORER.read_text()\n    ide_rust = IDE_MANAGER_RUST.read_text()\n    developer_text = (ROOT / 'src' / 'DeveloperIDE.tsx').read_text()\n    for token in ['@monaco-editor/react', 'registerCompletionItemProvider', 'MarkerSeverity', 'bracketPairColorization']:\n        assert token in smart, token\n    for token in ['Boards', 'Libraries', 'Examples', 'arduino_core_install', 'arduino_library_install', 'arduino_board_url_add']:\n        assert token in ecosystem, token\n    for token in ['Sketchbook & project files', 'developer_sketchbook_list', 'developer_project_files']:\n        assert token in sketchbook, token\n    for token in ['arduino_core_search', 'arduino_library_search', 'developer_project_file_save', 'Documents', 'Arduino']:\n        assert token in ide_rust, token\n    for token in ['SmartArduinoEditor', 'Boards & Libraries', 'Sketchbook', 'developer_project_file_save', 'compileDiagnostics']:\n        assert token in developer_text, token\n    for token in ['ide_manager::arduino_core_list', 'ide_manager::arduino_library_list', 'ide_manager::developer_project_files']:\n        assert token in rust, token\n\n'''
          assert needle in s
          s = s.replace(needle, needle + extra, 1)
          s = s.replace("assert package['version'] == '0.2.0-alpha.3'", "assert package['version'] == '0.2.0-alpha.4'")
          s = s.replace("assert tauri['version'] == '0.2.0-alpha.3'", "assert tauri['version'] == '0.2.0-alpha.4'")
          s = s.replace("assert '0.2.0-alpha.3' in (ROOT / 'src-tauri' / 'Cargo.toml').read_text()", "assert '0.2.0-alpha.4' in (ROOT / 'src-tauri' / 'Cargo.toml').read_text()")
          s = s.replace("BetterBoard Studio v0.2.0-alpha.3 self-check", "BetterBoard Studio v0.2.0-alpha.4 self-check")
          self_path.write_text(s)

          fpath = root / 'scripts/functionality_surface_check.py'
          f = fpath.read_text()
          marker = "    'OpenPenguin Bridge': SRC / 'OpenPenguinBridge.tsx',\n"
          assert marker in f
          f = f.replace(marker, marker + "    'Smart Arduino Editor': SRC / 'SmartArduinoEditor.tsx',\n    'Arduino Ecosystem Manager': SRC / 'ArduinoEcosystemManager.tsx',\n    'Sketchbook Explorer': SRC / 'SketchbookExplorer.tsx',\n", 1)
          print_marker = "print('BetterBoard functionality surface check: PASS')"
          assert print_marker in f
          assertions = '''# Arduino IDE parity Phase 1 is a baseline capability contract.\nsmart_editor = (SRC / 'SmartArduinoEditor.tsx').read_text()\necosystem_manager = (SRC / 'ArduinoEcosystemManager.tsx').read_text()\nsketchbook_explorer = (SRC / 'SketchbookExplorer.tsx').read_text()\nide_manager = (ROOT / 'src-tauri' / 'src' / 'ide_manager.rs').read_text()\nfor token in ['@monaco-editor/react', 'registerCompletionItemProvider', 'MarkerSeverity', 'lineNumbers', 'folding']:\n    assert token in smart_editor, f'Smart editor lost {token}'\nfor token in ['Boards', 'Libraries', 'Examples', 'arduino_core_install', 'arduino_library_install', 'arduino_board_url_add']:\n    assert token in ecosystem_manager, f'Arduino ecosystem manager lost {token}'\nfor token in ['developer_sketchbook_list', 'developer_project_files', 'Sketchbook & project files']:\n    assert token in sketchbook_explorer, f'Sketchbook explorer lost {token}'\nfor token in ['arduino_core_list', 'arduino_core_search', 'arduino_library_list', 'arduino_library_search', 'developer_project_file_save']:\n    assert token in ide_manager, f'IDE backend lost {token}'\nfor token in ['SmartArduinoEditor', 'Boards & Libraries', 'Sketchbook', 'compileDiagnostics', 'developer_project_file_save']:\n    assert token in developer, f'Developer IDE parity surface lost {token}'\n\n'''
          f = f.replace(print_marker, assertions + print_marker, 1)
          fpath.write_text(f)
          PY

      - name: TypeScript and Vite build
        run: npm run build

      - name: BetterBoard structural self-check
        run: python3 scripts/self_check.py

      - name: Functionality surface no-regression check
        run: python3 scripts/functionality_surface_check.py

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit verified IDE parity phase
        run: |
          rm .github/workflows/ide-parity-phase1-finalize.yml
          git config user.name "BetterBoard CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Complete IDE Parity Phase 1 in alpha.4"
          git push origin HEAD:ux/ide-parity-phase1
