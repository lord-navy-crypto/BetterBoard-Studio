name: BetterBoard quality

on:
  push:
    branches:
      - main
      - numeric-error-research-pack
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: BetterBoard repository self-check
        run: python scripts/self_check.py

      - name: ESP32 analyzer contract self-check
        run: python scripts/esp32_analyzer_self_check.py

      - name: ESP32 build manifest self-check
        run: python scripts/esp32_build_manifest_self_check.py

      - name: ESP32 security capability self-check
        run: python scripts/esp32_security_capability_self_check.py

      - name: ESP32 attestation capability self-check
        run: python scripts/esp32_attestation_capabilities_self_check.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check
