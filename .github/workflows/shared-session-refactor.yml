name: Shared session refactor

on:
  push:
    branches:
      - ux/unified-monitor-data-workspace
    paths:
      - .github/refactor-trigger

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/unified-monitor-data-workspace
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded source refactor
        run: python3 scripts/refactor_shared_hardware_session.py

      - name: Verify frontend
        run: |
          npm install
          npm run build
          python3 scripts/self_check.py

      - name: Commit verified refactor
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NumericalBenchSuiteV2.tsx src/MagnetBenchSuiteV2.tsx
          git commit -m "Share hardware session across experiment labs [shared-session-refactor]"
          git push origin HEAD:ux/unified-monitor-data-workspace
