name: Finalize copy and OpenPenguin entry

on:
  push:
    branches: [ux/copy-openguin-entry]
    paths:
      - '.github/workflows/copy-openguin-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/copy-openguin-entry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Alpha 0.7 copy and OpenPenguin patch
        run: python3 scripts/copy_openguin_phase.py
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: BetterBoard structural self-check
        run: python3 scripts/self_check.py
      - name: Functionality surface no-regression check
        run: python3 scripts/functionality_surface_check.py
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - name: Rust check
        working-directory: src-tauri
        run: cargo check
      - name: Commit verified Alpha 0.7 product files
        run: |
          git config user.name 'BetterBoard CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src src-tauri package.json package-lock.json CHANGELOG.md scripts/self_check.py
          git commit -m 'Add one-click copy controls and global OpenPenguin entry'
          git push origin HEAD:ux/copy-openguin-entry
