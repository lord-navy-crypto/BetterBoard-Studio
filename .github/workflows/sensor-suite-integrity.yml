name: Sensor Suite v1 Integrity

on:
  pull_request:
    paths:
      - 'sensor-suite/**'
      - 'scripts/install_sensor_suite.py'
      - 'scripts/sensor_suite_self_check.py'
      - 'docs/SENSOR_SUITE_V1.md'
      - 'INSTALL_SENSOR_SUITE.command'
      - '.github/workflows/sensor-suite-integrity.yml'
  push:
    branches:
      - 'feature/sensor-suite-v1'
    paths:
      - 'sensor-suite/**'
      - 'scripts/install_sensor_suite.py'
      - 'scripts/sensor_suite_self_check.py'
      - 'docs/SENSOR_SUITE_V1.md'
      - 'INSTALL_SENSOR_SUITE.command'
      - '.github/workflows/sensor-suite-integrity.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Sensor Suite structural validation
        run: python3 scripts/sensor_suite_self_check.py

      - name: Prove dry-run installation
        run: python3 scripts/install_sensor_suite.py --dry-run

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino cores and Sensor Suite libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "Adafruit LSM6DS"
          arduino-cli lib install "Adafruit VL53L1X"
          arduino-cli lib install "Adafruit INA219"
          arduino-cli lib install "Adafruit BME280 Library"
          arduino-cli lib install "Adafruit ADXL345"
          arduino-cli lib install "Adafruit MLX90393"
          arduino-cli lib install "HX711"

      - name: Compile Sensor Suite firmware for UNO reference target
        run: |
          for sketch in \
            LSM6DSOX_Motion VL53L1X_Displacement INA219_Power BME280_Environment HX711_Force \
            MotionFusion_LSM6DSOX_VL53L1X MotorPowerBench_TB6612_INA219 \
            LSM6DSOX_VibrationStats LSM6DSOX_GyroIntegration VL53L1X_Kinematics INA219_Energy \
            BME280_DriftMonitor HX711_ForceDynamics EncoderKinematics PhotogatePeriodStats \
            DualAccelerometerCrossCheck MotorEncoderPowerBench \
            MLX90393_FieldStatistics MLX90393_BaselineDelta ADXL345_TiltEstimate LSM6DSOX_BiasSurvey \
            Pendulum_IMU_Encoder Oscillator_ToF_ADXL345 HX711_CreepMonitor INA219_PowerStability \
            ADC_NoiseStatistics ADC_OversamplingComparison LSM6DSOX_ImpactTrigger ADXL345_VibrationRMS \
            Photogate_GateTiming LSM6DSOX_ComplementaryTilt BME280_RelativeAltitude HX711_LoadRepeatability \
            MotorStepResponse_EncoderPower MotorRampHysteresis_EncoderPower IMU_ToF_MotionTrigger \
            Photogate_KnownWidthSpeed EncoderGyro_CrossCheck ADXL345_JerkMonitor VL53L1X_FreeDecay \
            MLX90393_FieldDirection BME280_ThermalStability INA219_LoadTransient HX711_ZeroDrift \
            ADC_StepDetector LSM6DSOX_RotationRepeatability; do
            arduino-cli compile --fqbn arduino:avr:uno "sensor-suite/firmware/$sketch"
          done

      - name: Compile Sensor Suite firmware for ESP32-S3 target
        run: |
          for sketch in \
            LSM6DSOX_Motion VL53L1X_Displacement INA219_Power BME280_Environment HX711_Force \
            MotionFusion_LSM6DSOX_VL53L1X MotorPowerBench_TB6612_INA219 \
            LSM6DSOX_VibrationStats LSM6DSOX_GyroIntegration VL53L1X_Kinematics INA219_Energy \
            BME280_DriftMonitor HX711_ForceDynamics EncoderKinematics PhotogatePeriodStats \
            DualAccelerometerCrossCheck MotorEncoderPowerBench \
            MLX90393_FieldStatistics MLX90393_BaselineDelta ADXL345_TiltEstimate LSM6DSOX_BiasSurvey \
            Pendulum_IMU_Encoder Oscillator_ToF_ADXL345 HX711_CreepMonitor INA219_PowerStability \
            ADC_NoiseStatistics ADC_OversamplingComparison LSM6DSOX_ImpactTrigger ADXL345_VibrationRMS \
            Photogate_GateTiming LSM6DSOX_ComplementaryTilt BME280_RelativeAltitude HX711_LoadRepeatability \
            MotorStepResponse_EncoderPower MotorRampHysteresis_EncoderPower IMU_ToF_MotionTrigger \
            Photogate_KnownWidthSpeed EncoderGyro_CrossCheck ADXL345_JerkMonitor VL53L1X_FreeDecay \
            MLX90393_FieldDirection BME280_ThermalStability INA219_LoadTransient HX711_ZeroDrift \
            ADC_StepDetector LSM6DSOX_RotationRepeatability; do
            arduino-cli compile --fqbn esp32:esp32:esp32s3 "sensor-suite/firmware/$sketch"
          done
