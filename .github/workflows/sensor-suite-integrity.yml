name: Sensor Suite v1 Integrity

on:
  pull_request:
    paths:
      - 'sensor-suite/**'
      - 'scripts/install_sensor_suite.py'
      - 'scripts/sensor_suite_self_check.py'
      - 'docs/SENSOR_SUITE_V1.md'
      - 'INSTALL_SENSOR_SUITE.command'
      - '.github/workflows/sensor-suite-integrity.yml'
  push:
    branches:
      - 'feature/sensor-suite-v1'
    paths:
      - 'sensor-suite/**'
      - 'scripts/install_sensor_suite.py'
      - 'scripts/sensor_suite_self_check.py'
      - 'docs/SENSOR_SUITE_V1.md'
      - 'INSTALL_SENSOR_SUITE.command'
      - '.github/workflows/sensor-suite-integrity.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - name: Python tooling syntax validation
        run: python3 -m py_compile scripts/install_sensor_suite.py scripts/sensor_suite_self_check.py

      - name: Sensor Suite structural validation
        run: python3 scripts/sensor_suite_self_check.py

      - name: Prove dry-run installation
        run: python3 scripts/install_sensor_suite.py --dry-run

      - name: Prove exact installed-state verification
        run: |
          tmpdir="$(mktemp -d)"
          python3 scripts/install_sensor_suite.py --destination "$tmpdir"
          python3 scripts/install_sensor_suite.py --destination "$tmpdir" --verify

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino cores and catalog-declared libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli core install esp32:esp32
          python3 - <<'PY' > /tmp/sensor-suite-libraries.txt
          import json
          from pathlib import Path
          libraries = set()
          for path in sorted(Path('sensor-suite').glob('catalog*.json')):
              for entry in json.loads(path.read_text(encoding='utf-8')):
                  libraries.update(entry.get('required_libraries', []))
          for library in sorted(libraries):
              print(library)
          PY
          while IFS= read -r library; do
            [ -z "$library" ] || arduino-cli lib install "$library"
          done < /tmp/sensor-suite-libraries.txt

      - name: Build catalog-derived sketch list
        run: |
          python3 - <<'PY' > /tmp/sensor-suite-sketches.txt
          import json
          from pathlib import Path
          sketches = []
          for path in sorted(Path('sensor-suite').glob('catalog*.json')):
              for entry in json.loads(path.read_text(encoding='utf-8')):
                  sketches.append(entry['sketch_name'])
          for sketch in sorted(sketches):
              print(sketch)
          PY
          test "$(wc -l < /tmp/sensor-suite-sketches.txt | tr -d ' ')" = "56"
          test "$(sort -u /tmp/sensor-suite-sketches.txt | wc -l | tr -d ' ')" = "56"

      - name: Compile Sensor Suite firmware for UNO reference target
        run: |
          while IFS= read -r sketch; do
            arduino-cli compile --fqbn arduino:avr:uno "sensor-suite/firmware/$sketch"
          done < /tmp/sensor-suite-sketches.txt

      - name: Compile Sensor Suite firmware for ESP32-S3 target
        run: |
          while IFS= read -r sketch; do
            arduino-cli compile --fqbn esp32:esp32:esp32s3 "sensor-suite/firmware/$sketch"
          done < /tmp/sensor-suite-sketches.txt
