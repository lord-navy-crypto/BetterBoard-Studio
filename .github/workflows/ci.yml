name: BetterBoard CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'ux/**'
      - 'numeric-error-*'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript and Vite build
        run: npm run build

      - name: BetterBoard structural self-check
        run: python3 scripts/self_check.py

      - name: Functionality surface no-regression check
        run: python3 scripts/functionality_surface_check.py

      - name: Monitor provenance and evidence-handling self-check
        run: python3 scripts/monitor_provenance_self_check.py

      - name: Circuit Lab persisted-design correctness self-check
        run: python3 scripts/circuit_local_design_self_check.py

      - name: OpenPenguin bridge boundary self-check
        run: python3 scripts/openguin_bridge_self_check.py

      - name: Observatory statistics boundary self-check
        run: python3 scripts/observatory_stats_self_check.py

      - name: Developer workspace correctness self-check
        run: python3 scripts/developer_workspace_self_check.py

      - name: Arduino CLI schema correctness self-check
        run: python3 scripts/arduino_cli_schema_self_check.py

      - name: Developer diagnostic attribution self-check
        run: python3 scripts/developer_diagnostic_self_check.py

      - name: Developer filesystem consistency self-check
        run: python3 scripts/developer_filesystem_self_check.py

      - name: Developer project rename transaction self-check
        run: python3 scripts/developer_rename_transaction_self_check.py

      - name: Developer Arduino example import self-check
        run: python3 scripts/developer_example_import_self_check.py

      - name: Developer ecosystem target-state self-check
        run: python3 scripts/developer_ecosystem_state_self_check.py

      - name: Developer Arduino uninstall target self-check
        run: python3 scripts/developer_uninstall_spec_self_check.py

      - name: Developer imported-example open workflow self-check
        run: python3 scripts/developer_example_open_self_check.py

      - name: Numerical depth self-check
        run: python3 scripts/numerical_depth_self_check.py

      - name: Numeric Error campaign analyzer self-check
        run: python3 scripts/numeric_error_campaign_self_check.py

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Arduino AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile numerical microbench firmware for UNO
        run: |
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericalDerivativeSweep
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericalCancellation
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericalAccumulation
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/EmbeddedNumericalReliability

      - name: Compile Numeric Error Depth firmware for UNO
        run: |
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_Aliasing
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_Cancellation
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_DebounceComparison
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_FixedPointVsFloat
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_OverflowSaturation
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_InteractiveStudioV2
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_ADCStabilityV2
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_FilterLagV2
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_QuantizationV2
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_PWMQuantizationV2
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_DerivativeV2
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_IntegrationV2
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_SummationV3
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_PIRTimingV2
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_PhotogateTimingV3
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_MultiSensorEventLabV3
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_SignalChainLabV1
          arduino-cli compile --fqbn arduino:avr:uno src-tauri/resources/firmware/NumericError_EventTimingLabV1

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml
