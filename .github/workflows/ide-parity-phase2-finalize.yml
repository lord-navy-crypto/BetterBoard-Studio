name: Finalize IDE parity phase 2

on:
  push:
    branches: [ux/ide-parity-phase2]
    paths:
      - '.github/workflows/ide-parity-phase2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/ide-parity-phase2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded Alpha 0.6 product changes
        run: python3 scripts/ide_parity_phase2_finalize.py
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: BetterBoard structural self-check
        run: python3 scripts/self_check.py
      - name: Functionality surface no-regression check
        run: python3 scripts/functionality_surface_check.py
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - name: Rust check
        working-directory: src-tauri
        run: cargo check
      - name: Commit verified Alpha 0.6 product files
        run: |
          git config user.name 'BetterBoard CI'
          git config user.email 'actions@users.noreply.github.com'
          git add src src-tauri package.json package-lock.json CHANGELOG.md scripts/self_check.py
          git commit -m 'Strengthen IDE parity with draft recovery and project tooling'
          git push origin HEAD:ux/ide-parity-phase2
