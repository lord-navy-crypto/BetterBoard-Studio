name: BetterBoard alpha.2 finalizer

on:
  push:
    branches:
      - ux/unified-monitor-data-workspace
    paths:
      - .github/serial-tx-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/unified-monitor-data-workspace
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Apply bounded alpha.2 finalization
        run: python3 scripts/refactor_serial_tx.py

      - name: Apply final TypeScript narrowing fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/MonitorDataStudio.tsx')
          text = path.read_text()
          old = "  const activePackage = replay?.session ?? measurement ?? latestMeasurement ?? null;"
          new = "  const activePackage = replay?.session ?? measurement ?? latestMeasurement ?? null;\n  const activePackageSamples = replay?.session.sample_count ?? measurement?.samples ?? latestMeasurement?.samples ?? null;"
          if text.count(old) != 1:
              raise SystemExit(f'activePackage anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          old = "<span>Port</span><b>{replay?.session.port ?? selectedPort || '—'}</b>"
          new = "<span>Port</span><b>{(replay?.session.port ?? selectedPort) || '—'}</b>"
          if text.count(old) != 1:
              raise SystemExit(f'port expression anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          old = "<b>{activePackage.sample_count ?? activePackage.samples} samples</b>"
          new = "<b>{activePackageSamples ?? '—'} samples</b>"
          if text.count(old) != 1:
              raise SystemExit(f'sample count anchor mismatch: {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          print('TypeScript union/nullish expressions narrowed explicitly')
          PY

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Verify frontend and contracts
        run: |
          npm run build
          python3 scripts/self_check.py

      - name: Verify Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit verified alpha.2
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize BetterBoard Studio 0.2.0-alpha.2 [finalize-alpha2]"
          git push origin HEAD:ux/unified-monitor-data-workspace
