name: Finalize BetterBoard Alpha 0.3

on:
  push:
    branches:
      - ux/parameterized-recipes-user-library

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ux/parameterized-recipes-user-library
          fetch-depth: 0

      - name: Finalize Alpha 0.3 product contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          old = '0.2.0-alpha.2'
          new = '0.2.0-alpha.3'
          for rel in [
              'package.json', 'package-lock.json', 'src-tauri/Cargo.toml',
              'src-tauri/tauri.conf.json', 'src-tauri/src/lib.rs', 'scripts/self_check.py'
          ]:
              path = root / rel
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'{rel}: missing expected old version')
              path.write_text(text.replace(old, new))

          app = root / 'src/App.tsx'
          text = app.read_text()
          if 'Studio · Alpha 0.2' not in text:
              raise SystemExit('App.tsx: expected Alpha 0.2 label missing')
          app.write_text(text.replace('Studio · Alpha 0.2', 'Studio · Alpha 0.3'))

          check = root / 'scripts/self_check.py'
          text = check.read_text()
          anchor = "    assert 'Runtime log' in RUNTIME_LOG.read_text()\n"
          addition = """    assert 'Runtime log' in RUNTIME_LOG.read_text()\n    for token in ['parameterValues', 'capture_measurement', 'save_measurement_buffer', 'RuntimeLog']:\n        assert token in monitor_text, token\n    assert 'parameterValues={parameterValues}' in app_text\n    assert 'recipe_parameters' in rust and 'firmware_sha256: sha256_text(&source)' in rust\n"""
          if anchor not in text:
              raise SystemExit('self_check.py: runtime log anchor missing')
          if "assert 'parameterValues={parameterValues}' in app_text" not in text:
              text = text.replace(anchor, addition)
          check.write_text(text)

          changelog = root / 'CHANGELOG.md'
          text = changelog.read_text()
          section = """## 0.2.0-alpha.3\n\n- Added compile-time parameter controls for canonical recipes with validated sliders/number inputs that affect real generated firmware.\n- Added **My Library** user presets under `~/Documents/BetterBoard/library` and Developer-derived reusable recipes.\n- Upgraded Developer into a template-first Arduino-style free editor with Save / Verify / Run / Upload / Save to Library.\n- Added a searchable Runtime Log inside Monitor & Data backed by Task Center operation logs.\n- Added a loopback-only **OpenPenguin · Local AI** bridge to the private local runtime at `127.0.0.1:11435`; no automatic cloud upload.\n- Added four numerical-error firmware programs: step-size differentiation, catastrophic cancellation, accumulation/Kahan summation, and MPU6050 rectangle-vs-trapezoidal gyro integration.\n- Added MPU6050, PIR, optical pulse/motor-speed, and driver-dependent rotary/stepper hardware profiles with explicit hardware-boundary warnings.\n- Moved Advanced Tools out of the experiment-domain navigation; legacy full-control workflows remain folded as an expert compatibility escape hatch while useful controls live in the normal Numerical/Magnet labs.\n- Measurement Evidence now carries effective recipe parameters and hashes the parameter-rendered firmware source.\n\n"""
          if '## 0.2.0-alpha.3' not in text:
              if not text.startswith('# Changelog\n'):
                  raise SystemExit('Unexpected changelog header')
              text = '# Changelog\n\n' + section + text[len('# Changelog\n\n'):]
              changelog.write_text(text)

          workflow = root / '.github/workflows/finalize-alpha3.yml'
          workflow.unlink()
          PY

      - name: Diff sanity
        run: git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript and Vite build
        run: npm run build

      - name: BetterBoard structural self-check
        run: python3 scripts/self_check.py

      - name: Functionality surface no-regression check
        run: python3 scripts/functionality_surface_check.py

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libudev-dev \
            patchelf

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Commit verified Alpha 0.3
        run: |
          git config user.name 'BetterBoard CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize BetterBoard Studio 0.2.0-alpha.3' || exit 0
          git push origin HEAD:ux/parameterized-recipes-user-library
