[package]
name = "betterboard-studio"
version = "0.2.0-alpha.1"
description = "Goal-first physical computing environment for Arduino-compatible boards"
edition = "2021"

[lib]
name = "betterboard_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.6"
chrono = { version = "0.4", features = ["clock"] }
sha2 = "0.10"
